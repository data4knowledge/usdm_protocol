
{% set study = data['study'] %}
{% set templates = data['templates'] %}
{% set id = "card_" ~ data['id'] ~ "_div" %}
{% set border = '' %}
<div id="{{id}}" class="card card-body rounded-3 h-100 {{border}}">
  <div class="row">
    <h6 class="card-subtitle">{{study['sponsor_name']}}: {{study['sponsor_protocol_identifier']}}</h6>
  </div>
  <div class="row mt-2">
    <div class="container">
      <p class="card-text text-muted lh-1"><small>{{study['title']}}</small></p>
    </div>
  </div>
  <div class="row mt-3">
    <div class="container">
      {% for template in templates %}
        <a href="/edit/{{data['id']}}" class="btn btn-sm btn-outline-primary rounded-5 mb-1">
          <i class="bi bi-gear"></i>
          {{template}}
        </a>  
      {% endfor %}
    </div>
  </div>
</div>
